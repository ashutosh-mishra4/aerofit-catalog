<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap');
@import url("https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css");
.serif{font-family:'Source Serif 4',serif}.sans{font-family:'Inter',sans-serif}.tnum{font-variant-numeric:tabular-nums}
.flood{transition:height .7s cubic-bezier(.16,.84,.44,1)}
.pin{animation:pi .45s cubic-bezier(.16,.84,.44,1) both}@keyframes pi{from{opacity:0;transform:translateX(14px)}}
</style>
<section class="sans bg-[#FAF8F6] text-[#2A0B14] py-20 px-16" data-kid="1" data-name="band lineup section" id="lineup">
<div class="flex items-end justify-between gap-8" data-kid="1-1" data-name="section header row">
<h2 class="serif text-[56px] leading-none font-medium tracking-[-0.02em]" data-kid="1-1-1" data-name="section headline">Five bands, <span class="italic text-[#C8553D]" data-kid="1-1-1-1" data-name="emphasized headline accent text">one app</span></h2>
<div class="flex items-center gap-1 p-1.5 rounded-full bg-[oklch(85.5%_0.0687_303)] shadow-[0_10px_30px_rgba(42,11,20,0.12),inset_0_1px_0_rgba(255,255,255,0.6)]" data-dynamic="true" data-kid="1-1-2" data-name="purchase mode and plan toggle bar" data-reason="entire button group re-rendered by script" id="bar"></div>
</div>
<div class="mt-10 grid grid-cols-[300px_1fr] gap-6" data-kid="1-2" data-name="tabs and detail panel grid">
<div class="flex flex-col gap-2" data-dynamic="true" data-kid="1-2-1" data-name="band selector tab list" data-reason="tab buttons generated and re-rendered by script" id="tabs"></div>
<div data-dynamic="true" data-kid="1-2-2" data-name="band detail panel" data-reason="panel content rebuilt by script on every selection change" id="panel"></div>
</div>
</section>
<script>
const IMG={lite:'https://kombai-assets.b-cdn.net/generated_assets/f9b46c42-f591-4385-bfc2-9b6663bcd54f/da32fd7c279245b5ab743623f57ddf23.jpg',smart:'https://kombai-assets.b-cdn.net/generated_assets/f9b46c42-f591-4385-bfc2-9b6663bcd54f/7754f0f6d49a4ed38f644dce2670c620.jpg',pro:'https://kombai-assets.b-cdn.net/generated_assets/f9b46c42-f591-4385-bfc2-9b6663bcd54f/72180f80b3a64de99cbdef213dc621cd.jpg',music:'https://kombai-assets.b-cdn.net/generated_assets/f9b46c42-f591-4385-bfc2-9b6663bcd54f/46a42b1d18d34403be756d1c74222484.jpg',ultra:'https://kombai-assets.b-cdn.net/generated_assets/f9b46c42-f591-4385-bfc2-9b6663bcd54f/76d7a24f75bc4dbeafec4d446b539a12.jpg'};
const P=[
{id:'ultra',n:'Ultra',b:'Ships Nov 4',t:'Titanium case, dual-band GPS and 14 days of battery for multi-day races.',g:[['14 days','Battery'],['Dual-band','GPS'],['32 g','Weight'],['Titanium','Case']],p:399,min:3,tile:'oklch(86.9% 0.0592 42)',c:[['Titanium','#8B8A87'],['Black','#1F1F1F'],['Trail','#6B7B4E']]},
{id:'pro',n:'Pro',b:'In stock',t:'Built-in GPS and ECG for structured training without your phone.',g:[['10 days','Battery'],['Built-in','GPS'],['27 g','Weight'],['Aluminum','Case']],p:279,min:2,tile:'oklch(90.4% 0.0408 155.4)',c:[['Graphite','#2E2E30'],['Volt','#E3E86A'],['Stone','#BDB5AC']]},
{id:'lite',n:'Lite',b:'Lightest',t:'Featherweight tracking for sleep, steps and daily recovery.',g:[['5 days','Battery'],['Via phone','GPS'],['18 g','Weight'],['Polymer','Case']],p:149,min:1,tile:'oklch(90.4% 0.0408 155.4)',c:[['Slate','#5E6E7D'],['Black','#1F1F1F'],['Sand','#D8C8B2']]},
{id:'smart',n:'Smart',b:'Everyday',t:'Everyday sleep, strain and recovery on an always-on display.',g:[['7 days','Battery'],['Via phone','GPS'],['24 g','Weight'],['Aluminum','Case']],p:199,min:1,tile:'oklch(86.9% 0.0592 42)',c:[['Black','#1F1F1F'],['Mist','#C8CDD2'],['Plum','#5B2439']]},
{id:'music',n:'Music',b:'Offline',t:'Stores 500 songs and plays to Bluetooth headphones on the run.',g:[['6 days','Battery'],['Built-in','GPS'],['28 g','Weight'],['4 GB','Music']],p:299,min:2,tile:'oklch(86.9% 0.0592 42)',c:[['Black','#1F1F1F'],['Ember','#C8553D'],['Ice','#DDE6EE']]}];
P.forEach(p=>{p.ci=0;p.s='M'});
const PL={1:['One',16,199],2:['Peak',25,299],3:['Life',33,399]};const SZ={S:'130–160 mm',M:'150–190 mm',L:'180–220 mm'};
let cur='ultra',mode='out',plan=2,cart=0,cmp=false;
const $=i=>document.getElementById(i),byId=i=>P.find(p=>p.id===i);
const cov=p=>mode==='mem'&&plan>=p.min;
function tabPrice(p){return mode==='out'?'$'+p.p:(plan>=p.min?'$0':'Needs '+PL[p.min][0])}
function render(){
 $('bar').innerHTML=[['out','Buy outright'],['mem','With membership']].map(([k,l])=>`<button data-m="${k}" class="h-9 px-4 rounded-full text-[13px] font-medium ${mode===k?'bg-[#F8F38A] shadow-sm':'hover:bg-white/40'}">${l}</button>`).join('')+'<span class="w-px h-6 bg-[#2A0B14]/20 mx-1"></span>'+[1,2,3].map(t=>`<button data-pl="${t}" class="h-9 px-3.5 rounded-full text-[13px] ${mode==='mem'&&t===plan?'bg-white font-medium shadow-[inset_0_1px_3px_rgba(42,11,20,0.15)]':'hover:bg-white/40'}">${PL[t][0]} <span class="tnum opacity-75">$${PL[t][2]}</span></button>`).join('');
 $('tabs').innerHTML=P.map(p=>{const on=p.id===cur;return `<button data-t="${p.id}" class="h-[76px] px-4 rounded-[20px] flex items-center gap-3 text-left transition ${on?'bg-white shadow-[0_8px_24px_rgba(42,11,20,0.08)] ring-2 ring-[#F8F38A]':'hover:bg-white/70'}">
  <span class="w-12 h-12 rounded-full flex items-center justify-center ${cov(p)?'bg-[#2A0B14]':''}" style="${cov(p)?'':'background:'+p.tile}"><span class="w-10 h-10 rounded-full bg-white overflow-hidden flex items-center justify-center"><img src="${IMG[p.id]}" alt="" class="w-10 h-10 object-contain mix-blend-multiply brightness-110" decoding="async" loading="lazy"></span></span>
  <span class="flex-1"><span class="block serif text-[20px] font-medium leading-none">${p.n}</span><span class="block mt-1 text-[12px] ${p.min===3?'text-[#C8553D] font-medium':'text-[#2A0B14]/65'}">${p.b}</span></span>
  <span class="text-[15px] font-semibold tnum ${tabPrice(p).startsWith('Needs')?'text-[13px] text-[#C8553D]':''}">${tabPrice(p)}</span></button>`}).join('')+
  `<button data-cmp class="mt-2 h-11 rounded-full border border-[#2A0B14]/20 text-[14px] font-medium flex items-center justify-center gap-2"><i class="ti ti-columns-3"></i>${cmp?'Hide comparison':'Compare the five'}</button>`;
 const p=byId(cur),c=cov(p);
 $('panel').innerHTML=`<div class="pin bg-[oklch(97.9%_0.0203_81.8)] rounded-[24px] border border-[#2A0B14]/10 p-6 grid grid-cols-[400px_1fr] gap-8">
  <div class="relative h-[460px] rounded-[18px] overflow-hidden flex items-center justify-center" style="background:${p.tile}">
   <div class="flood absolute left-0 right-0 bottom-0 bg-[#2A0B14]" style="height:${c?'100%':'0%'}"></div>
   <span class="relative w-[300px] h-[300px] rounded-full bg-white flex items-center justify-center overflow-hidden"><img src="${IMG[p.id]}" alt="Aero Fit ${p.n} in ${p.c[p.ci][0]}" class="w-[270px] h-[270px] object-contain mix-blend-multiply brightness-110 contrast-[1.05]" decoding="async" loading="lazy"></span>
   <span class="absolute left-4 top-4 text-[12px] font-medium px-3 py-1 rounded-full bg-white/90">${p.b}</span>
   ${c?`<span class="absolute left-5 bottom-5 text-[#FAF8F6]"><span class="serif text-[44px] font-medium leading-none">$0</span><span class="block text-[13px] mt-1">band with ${PL[plan][0]}</span></span>`:''}
  </div>
  <div class="flex flex-col">
   <h3 class="serif text-[44px] font-medium leading-none">Aero Fit ${p.n}</h3>
   <p class="mt-3 text-[15px] text-[#2A0B14]/75 max-w-[440px]">${p.t}</p>
   <div class="mt-6 grid grid-cols-2 gap-2 max-w-[360px]">${p.g.map(([v,l])=>`<div class="rounded-[14px] bg-white px-3 py-3"><p class="serif text-[17px] font-medium leading-tight whitespace-nowrap">${v}</p><p class="mt-1 text-[12px] text-[#2A0B14]/65">${l}</p></div>`).join('')}</div>
   <p class="mt-6 text-[13px] text-[#2A0B14]/65">Colour · <span class="text-[#2A0B14] font-medium">${p.c[p.ci][0]}</span></p>
   <div class="mt-2 flex gap-2">${p.c.map((x,j)=>`<button data-c="${j}" aria-label="${x[0]}" class="w-10 h-10 rounded-full p-1 border-2 ${j===p.ci?'border-[#2A0B14]':'border-transparent'}"><span class="block w-full h-full rounded-full ring-1 ring-black/10" style="background:${x[1]}"></span></button>`).join('')}</div>
   <p class="mt-5 text-[13px] text-[#2A0B14]/65">Size ${p.s} fits wrists ${SZ[p.s]}</p>
   <div class="mt-2 inline-flex self-start p-1 rounded-full bg-white shadow-[inset_0_2px_5px_rgba(42,11,20,0.1)]">${['S','M','L'].map(s=>`<button data-s="${s}" class="w-12 h-9 rounded-full text-[14px] font-medium ${s===p.s?'bg-[oklch(85.5%_0.0687_303)]':'text-[#2A0B14]/65'}">${s}</button>`).join('')}</div>
   <div class="mt-auto pt-6 border-t border-[#2A0B14]/10 flex items-center justify-between">
    <div>${mode==='out'?`<p class="serif text-[36px] font-medium tnum leading-none">$${p.p}</p><p class="text-[13px] text-[#2A0B14]/65 mt-1">One-time · free returns</p>`:c?`<p class="serif text-[36px] font-medium leading-none">$0 band</p><p class="text-[13px] text-[#2A0B14]/65 mt-1">With ${PL[plan][0]} · $${PL[plan][2]}/yr ($${PL[plan][1]}/mo)</p>`:`<p class="serif text-[26px] font-medium leading-none">Included with ${PL[p.min][0]}</p><p class="text-[13px] text-[#2A0B14]/65 mt-1">Not part of ${PL[plan][0]}</p>`}</div>
    ${mode==='mem'&&!c?`<button data-pl="${p.min}" class="h-12 px-6 rounded-full border border-[#2A0B14]/30 text-[15px] font-medium">Switch to ${PL[p.min][0]}</button>`:`<button data-add class="h-12 px-6 rounded-full bg-[#2A0B14] text-white text-[15px] font-medium inline-flex items-center gap-2 hover:bg-[#45172A]"><i class="ti ti-shopping-bag"></i>${p.min===3&&mode==='out'?'Pre-order Ultra':'Add '+p.n+' to cart'}${cart?`<span class="ml-1 min-w-6 h-6 px-1.5 rounded-full bg-[#F8F38A] text-[#2A0B14] text-[12px] flex items-center justify-center">${cart}</span>`:''}</button>`}
   </div>
  </div></div>
  ${cmp?`<div class="mt-4 bg-white rounded-[20px] border border-[#2A0B14]/10 overflow-hidden text-[14px]">${[['Band',P.map(x=>x.n)],['Battery',P.map(x=>x.g[0][0])],['GPS',P.map(x=>x.g[1][0])],['Weight',P.map(x=>x.g[2][0])],['Outright',P.map(x=>'$'+x.p)],['Included with',P.map(x=>['','One, Peak, Life','Peak, Life','Life only'][x.min])]].map((r,i)=>`<div class="grid grid-cols-[140px_repeat(5,1fr)] ${i?'border-t border-[#2A0B14]/8':'bg-[oklch(97.9%_0.0203_81.8)] font-medium'}"><span class="px-4 py-3 text-[#2A0B14]/65">${r[0]}</span>${r[1].map((v,j)=>`<span class="px-3 py-3 ${P[j].id===cur?'bg-[#F8F38A]/40 font-medium':''}">${v}</span>`).join('')}</div>`).join('')}</div>`:''}`;
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,p=byId(cur);
 if(d.t)cur=d.t;else if(d.m)mode=d.m;else if(d.pl){plan=+d.pl;mode='mem'}else if(d.c!==undefined)p.ci=+d.c;else if(d.s)p.s=d.s;else if('add' in d)cart++;else if('cmp' in d)cmp=!cmp;
 render();if(!d.t)document.querySelector('.pin').style.animation='none'});
render();
</script>
